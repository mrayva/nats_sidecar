# nats_sidecar configuration example

nats_address: "127.0.0.1"
nats_port: 4222

# Input: core NATS subjects carrying binary-encoded messages, all sharing
# this file's one attribute schema below. Every message from every listed
# subject is matched against the same subscription tree. Add more entries
# to subscribe to multiple subjects at once:
#   input_subjects: ["sensor.data", "sensor.data.backup"]
# output_prefix (below) must be set explicitly whenever more than one
# input subject is listed - with exactly one, it defaults to that subject.
input_subjects: ["sensor.data"]
format: msgpack          # msgpack | cbor | flexbuffers | zera | ion | bson | beve
# input_queue_group: "sidecar-group"  # uncomment to load-balance across instances

# Matching engine - both accept the same expression syntax, except
# "is not empty" which only atree supports (see README's Expression Syntax
# section). Switching this after subscriptions exist won't crash startup,
# but any persisted subscription that used "is not empty" will fail to
# restore under engine: betree (logged as a warning and skipped, not lost -
# the lease record itself is untouched).
engine: atree             # atree | betree

# Output: matched messages published to <output_prefix>.<BE-ID>
output_prefix: "sensor.filtered"

# Subscription management endpoints
subscribe_subject: "sidecar.subscribe"
unsubscribe_subject: "sidecar.unsubscribe"

# Soft-state lease settings (NATS KV). A client's only renewal signal is
# calling sidecar.subscribe again for the same expression/client_id (cheap -
# just a lease-holder-set insert, no tree mutation - see subscription_manager
# ::subscribe()'s "reused expression" branch); there is no separate heartbeat
# endpoint. If a client stops renewing (crash, forgot to unsubscribe, etc.),
# its subscription is torn down somewhere between lease_ttl_seconds and
# lease_ttl_seconds + lease_check_interval_seconds later - that window is
# this sidecar's "grace period" for a gone client. The two knobs trade off
# directly: shorter values mean faster cleanup of dead clients but require
# clients to re-subscribe that often just to stay alive; the defaults below
# favor rarely-needed renewal over fast cleanup (a dead client's resources
# can linger up to an hour). See README.md's "Grace period / dead-client
# cleanup" section for the full reasoning, including why a short
# lease_check_interval_seconds is now cheap even under high subscription
# churn (see the "High-churn-under-load" section's remove() fix).
lease_bucket: "sidecar-leases"
lease_ttl_seconds: 3600           # bucket is created/validated with this TTL
lease_check_interval_seconds: 60  # reconcile expired/deleted lease keys

# Example "responsive grace period" profile instead of the defaults above -
# a dead client's subscription is cleaned up within ~15-20s instead of up to
# ~1 hour, at the cost of clients needing to re-subscribe every ~10-15s to
# stay alive. Uncomment and tune for your own deployment's actual renewal
# cadence - these are illustrative starting points, not a recommended default.
# lease_ttl_seconds: 15
# lease_check_interval_seconds: 5

# A-Tree attribute schema - defines the fields available for boolean expressions
# Clients write expressions like: temperature > 30.0 AND location = "warehouse-A"
attributes:
  - name: temperature
    type: float
  - name: humidity
    type: float
  - name: location
    type: string
  - name: severity
    type: integer
  - name: active
    type: boolean
  - name: tags
    type: string_list

# Operational
stats_interval_seconds: 10
log_level: info

# Worker threads for parallel message processing
# 0 = use std::thread::hardware_concurrency()
# worker_threads: 4

# Bounded input queue. Newest messages are dropped when either limit is hit.
input_queue_max_messages: 10000
input_queue_max_bytes: 67108864   # 64 MiB

# Bounded output work. Each task may publish to multiple matching subjects.
publish_max_inflight: 1024
publish_backpressure_timeout_ms: 5000
